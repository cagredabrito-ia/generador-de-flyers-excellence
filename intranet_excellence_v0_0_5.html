<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet Excellence v0.0.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --burdeos: #7A0F1E;
            --burdeos-oscuro: #4E0812;
            --dorado: #C9A46A;
            --dorado-claro: #E8D3A8;
            --dorado-oscuro: #A4793C;
            --crema: #FAF6EF;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--crema);
            color: #2a1a1c;
        }

        .serif { font-family: 'Cinzel', serif; }
        .burdeos-text { color: var(--burdeos); }
        .gold-text { color: var(--dorado-oscuro); }

        .form-container {
            background: #ffffff;
            border: 1px solid #ecdfca;
            border-radius: 24px;
            box-shadow: 0 20px 50px -20px rgba(78, 8, 18, 0.25);
            border-top: 5px solid var(--burdeos);
        }

        .input-exc {
            background: #fdfbf7;
            border: 1px solid #e3d5bd;
            color: #2a1a1c;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            transition: all 0.3s;
        }

        .input-exc:focus {
            border-color: var(--dorado);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(201, 164, 106, 0.25);
        }

        .label-exc {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
            color: var(--burdeos);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--dorado-claro) 0%, var(--dorado) 45%, var(--dorado-oscuro) 100%);
            color: var(--burdeos-oscuro);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(164, 121, 60, 0.45); }

        .btn-burdeos {
            background: linear-gradient(135deg, var(--burdeos) 0%, var(--burdeos-oscuro) 100%);
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-burdeos:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(122, 15, 30, 0.4); }

        .extra-badge {
            background: #fbf3e6;
            color: var(--burdeos);
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            border: 1px solid var(--dorado);
        }

        .gold-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--dorado), transparent);
        }

        #modalOverlay {
            background: rgba(46, 5, 11, 0.85);
            backdrop-filter: blur(12px);
        }

        .photo-slot {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--dorado);
        }
        .photo-slot .main-tag {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(122, 15, 30, 0.85);
            color: var(--dorado-claro);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            padding: 2px 0;
        }
        .delete-photo {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--burdeos);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>

                    <option value="TERRENO">TERRENO</option>

            <div>

            <div>
                <label class="label-exc">Hab.</label>
                <input type="text" id="hab" class="input-exc num-input text-center" value="0">
            </div>
            <div>
                <label class="label-exc">Baños</label>

            <div>

                <button onclick="downloadFlyer()" class="w-full mt-6 btn-gold py-4 rounded-xl">Descargar Flyer JPG</button>
            </div>
        </div>

    <script>
        const BURDEOS = "#7A0F1E";
        const BURDEOS_OSC = "#4E0812";
        const DORADO = "#C9A46A";
        const DORADO_CLARO = "#E8D3A8";
        const DORADO_OSC = "#A4793C";
        const CREMA = "#FAF6EF";

        const logoImg = new Image();
        logoImg.src = document.querySelector('header img').src;

        let extras = [];
        let images = [];

        document.querySelectorAll('.num-input').forEach(el => {
            el.addEventListener('focus', function() { if (this.value === "0") this.value = ""; });
            el.addEventListener('blur', function() { if (this.value === "") this.value = "0"; });
            el.addEventListener('input', function() { this.value = this.value.replace(/[^0-9.,]/g, ''); });
        });

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function addExtra() {
            const input = document.getElementById('extraInput');
            const val = input.value.trim();
            if (val) { extras.push(val); renderExtras(); input.value = ""; }
        }

        function removeExtra(index) { extras.splice(index, 1); renderExtras(); }

        function renderExtras() {
            const container = document.getElementById('extrasList');
            container.innerHTML = extras.map((ex, i) => `
                <div class="extra-badge">${escapeHtml(ex)} <i class="fas fa-times ml-2 cursor-pointer hover:text-red-700" onclick="removeExtra(${i})"></i></div>
            `).join('');
        }

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        if (images.length >= 4) return;
                        images.push(img);
                        renderPhotos();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
            e.target.value = "";
        }

        function deletePhoto(index) {
            images.splice(index, 1);
            renderPhotos();
        }

        function renderPhotos() {
            const preview = document.getElementById('photosPreview');
            preview.innerHTML = images.map((img, idx) => `
                <div class="photo-slot">
                    <div class="delete-photo" onclick="deletePhoto(${idx})"><i class="fas fa-times"></i></div>
                    <img src="${img.src}" class="w-full h-full object-cover">
                    ${idx === 0 ? '<div class="main-tag">PRINCIPAL</div>' : ''}
                </div>
            `).join('');
        }

        async function generate(mode) {
            const d = {
                op: document.getElementById('op_tipo').value,
                in: document.getElementById('in_tipo').value,
                res: document.getElementById('nombre').value || "PROPIEDAD",
                ubi: document.getElementById('ubicacion').value || "VALENCIA, CARABOBO",
                precio: document.getElementById('precio').value,
                m2: document.getElementById('m2').value,
                hab: document.getElementById('hab').value,
                ban: document.getElementById('banos').value,
                est: document.getElementById('puestos').value,
                planta: document.getElementById('planta').value,
                pozo: document.getElementById('pozo').value,
                vigi: document.getElementById('vigilancia').value,
                cerrado: document.getElementById('cerrado').value
            };

            let wa = `✨ *EXCELLENCE* ✨\n_Finanzas y Bienes Raíces_\n\n📍 *${d.res.toUpperCase()}*\n🏡 *${d.in} ${d.op}*\n\n📐 *Superficie:* ${d.m2} M²\n`;
            if (d.hab !== "0") wa += `🛏️ *Habitaciones:* ${d.hab}\n`;
            if (d.ban !== "0") wa += `🚿 *Baños:* ${d.ban}\n`;
            if (d.est !== "0") wa += `🚗 *Estacionamientos:* ${d.est}\n`;
            wa += `\n`;

            let attrs = "";
            if (d.planta !== "0%") attrs += `⚡ Planta Eléctrica: ${d.planta}\n`;
            if (d.pozo === "SI") attrs += `💧 Pozo de Agua\n`;
            if (d.vigi !== "NO") attrs += `🛡️ Vigilancia: ${d.vigi}\n`;
            if (d.cerrado === "SI") attrs += `🚧 Conjunto Cerrado\n`;
            extras.forEach(ex => attrs += `✅ ${ex}\n`);

            if (attrs) wa += `*ATRIBUTOS:*\n${attrs}\n`;
            wa += `📍 ${d.ubi}\n\n💰 *INVERSIÓN:* $${d.precio}\n\n_Excellence · Su mejor aliado en finanzas y bienes raíces._`;

            document.getElementById('textOutput').innerText = wa;
            document.getElementById('modalOverlay').classList.remove('hidden');

            const flyerBox = document.getElementById('flyerResult');
            if (mode === 'flyer') {
                flyerBox.classList.remove('hidden');
                await drawFlyer(d);
            } else {
                flyerBox.classList.add('hidden');
            }
        }

        // Dibuja la imagen recortada para cubrir el área sin deformarla
        function drawCover(ctx, img, x, y, w, h) {
            const boxRatio = w / h;
            const imgRatio = img.width / img.height;
            let sw, sh, sx, sy;
            if (imgRatio > boxRatio) { sh = img.height; sw = img.height * boxRatio; sx = (img.width - sw) / 2; sy = 0; }
            else { sw = img.width; sh = img.width / boxRatio; sx = 0; sy = (img.height - sh) / 2; }
            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }

        // Reduce el tamaño de letra hasta que el texto quepa en maxW
        function fitText(ctx, text, maxW, size, weight, family) {
            let s = size;
            do {
                ctx.font = `${weight} ${s}px ${family}`;
                s -= 2;
            } while (ctx.measureText(text).width > maxW && s > 18);
        }

        function goldGradient(ctx, y0, y1) {
            const g = ctx.createLinearGradient(0, y0, 0, y1);
            g.addColorStop(0, DORADO_CLARO);
            g.addColorStop(0.5, DORADO);
            g.addColorStop(1, DORADO_OSC);
            return g;
        }

        async function drawFlyer(d) {
            try {
                await Promise.all([
                    document.fonts.load("700 100px Cinzel"),
                    document.fonts.load("900 100px Montserrat"),
                    document.fonts.load("800 40px Montserrat"),
                    document.fonts.load("600 30px Montserrat")
                ]);
            } catch (e) {}
            if (!logoImg.complete) await new Promise(r => { logoImg.onload = r; logoImg.onerror = r; });

            const canvas = document.getElementById('flyerCanvas');
            const ctx = canvas.getContext('2d');
            const W = 1080, H = 1350;
            const PHOTO_H = 900;
            const GRID_Y = 906, GRID_H = 240;
            const BAND_Y = 1152;

            // Fondo burdeos
            ctx.fillStyle = BURDEOS_OSC;
            ctx.fillRect(0, 0, W, H);

            // Imagen principal
            if (images[0]) {
                drawCover(ctx, images[0], 0, 0, W, PHOTO_H);
            } else {
                const bg = ctx.createLinearGradient(0, 0, W, PHOTO_H);
                bg.addColorStop(0, BURDEOS);
                bg.addColorStop(1, BURDEOS_OSC);
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, W, PHOTO_H);
            }

            // Sombreado superior en burdeos
            const topGrad = ctx.createLinearGradient(0, 0, 0, 340);
            topGrad.addColorStop(0, "rgba(46, 5, 11, 0.85)");
            topGrad.addColorStop(1, "rgba(46, 5, 11, 0)");
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, W, 340);

            // Difuminado inferior de la foto hacia burdeos
            const midGrad = ctx.createLinearGradient(0, 560, 0, PHOTO_H);
            midGrad.addColorStop(0, "rgba(78, 8, 18, 0)");
            midGrad.addColorStop(0.55, "rgba(78, 8, 18, 0.75)");
            midGrad.addColorStop(1, "rgba(78, 8, 18, 1)");
            ctx.fillStyle = midGrad;
            ctx.fillRect(0, 560, W, PHOTO_H - 560);

            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";
            ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
            ctx.shadowBlur = 18;

            // Tipo de inmueble
            ctx.fillStyle = "#ffffff";
            fitText(ctx, d.in.toUpperCase(), 980, 104, 700, "Cinzel");
            ctx.fillText(d.in.toUpperCase(), 540, 130);

            // Operación con líneas doradas
            ctx.font = "800 40px Montserrat";
            ctx.letterSpacing = "12px";
            ctx.fillStyle = DORADO_CLARO;
            ctx.fillText(d.op, 546, 192);
            const opW = ctx.measureText(d.op).width;
            ctx.letterSpacing = "0px";
            ctx.shadowBlur = 0;
            ctx.fillStyle = DORADO;
            ctx.fillRect(540 - opW / 2 - 90, 178, 70, 3);
            ctx.fillRect(540 + opW / 2 + 20, 178, 70, 3);

            // Residencia y precio
            ctx.shadowBlur = 18;
            ctx.fillStyle = "#ffffff";
            fitText(ctx, d.res.toUpperCase(), 980, 70, 700, "Cinzel");
            ctx.fillText(d.res.toUpperCase(), 540, 752);

            const priceTxt = "$" + d.precio;
            fitText(ctx, priceTxt, 980, 120, 900, "Montserrat");
            ctx.fillStyle = goldGradient(ctx, 770, 870);
            ctx.fillText(priceTxt, 540, 866);
            ctx.shadowBlur = 0;

            // Filetes dorados + grid de 3 imágenes auxiliares
            ctx.fillStyle = goldGradient(ctx, PHOTO_H, BAND_Y);
            ctx.fillRect(0, PHOTO_H, W, 6);
            ctx.fillRect(0, GRID_Y + GRID_H, W, 6);
            const gap = 6;
            const cellW = (W - gap * 2) / 3;
            for (let i = 0; i < 3; i++) {
                const x = i * (cellW + gap);
                const imgToDraw = images[i + 1] || images[0];
                if (imgToDraw) {
                    drawCover(ctx, imgToDraw, x, GRID_Y, cellW, GRID_H);
                } else {
                    ctx.fillStyle = BURDEOS;
                    ctx.fillRect(x, GRID_Y, cellW, GRID_H);
                }
                if (i < 2) {
                    ctx.fillStyle = DORADO;
                    ctx.fillRect(x + cellW, GRID_Y, gap, GRID_H);
                }
            }

            // Banda inferior crema con logo y ubicación
            ctx.fillStyle = CREMA;
            ctx.fillRect(0, BAND_Y, W, H - BAND_Y);

            const logoH = 160;
            const logoW = logoImg.naturalWidth ? logoH * logoImg.naturalWidth / logoImg.naturalHeight : 0;
            if (logoW) ctx.drawImage(logoImg, 40, BAND_Y + (H - BAND_Y - logoH) / 2, logoW, logoH);

            const textX = 40 + logoW + 40;
            ctx.fillStyle = DORADO;
            ctx.fillRect(textX - 20, BAND_Y + 40, 3, H - BAND_Y - 80);

            ctx.textAlign = "left";
            const ubiTxt = "📍 " + d.ubi.toUpperCase();
            ctx.fillStyle = BURDEOS;
            fitText(ctx, ubiTxt, W - textX - 40, 38, 800, "Montserrat");
            ctx.fillText(ubiTxt, textX, BAND_Y + 92);

            ctx.fillStyle = DORADO_OSC;
            ctx.font = "italic 600 26px Montserrat";
            ctx.fillText("Su mejor aliado inmobiliario", textX, BAND_Y + 140);

            const imgDisplay = document.getElementById('flyerDisplay');
            imgDisplay.src = canvas.toDataURL('image/jpeg', 0.95);
        }

        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        function copyText() {
            const txt = document.getElementById('textOutput').innerText;
            const temp = document.createElement("textarea");
            document.body.appendChild(temp);
            temp.value = txt;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "¡Copiado!";
            setTimeout(() => { btn.innerText = "Copiar"; }, 1500);
        }

        function downloadFlyer() {
            const canvas = document.getElementById('flyerCanvas');
            const link = document.createElement('a');
            link.download = `Flyer_Excellence_v005_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }
    </script>
</body>
